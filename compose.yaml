name: euclide-orientamento
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Esegui prima sh configura.sh}
    volumes:
      - dati:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  dati:
